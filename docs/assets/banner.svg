<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Git Ontology Agent: requests become branches; one merged answer.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151b34"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, sans-serif">
    <text x="80" y="150" font-size="64" font-weight="700" fill="url(#t)">Git Ontology Agent</text>
    <text x="80" y="205" font-size="26" fill="#cbd5e1">Talk to your agent mid-task. Every request is a branch.</text>
    <text x="80" y="242" font-size="26" fill="#cbd5e1">The ontology knows what to redo and how to merge.</text>
    <text x="80" y="320" font-size="18" fill="#64748b" font-family="ui-monospace, 'SF Mono', Menlo, monospace">req/1 ← budget (k1) · req/3 independent (k3) · main ← merge M · final answer with provenance</text>
  </g>
  <g stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M820 300 H1200" stroke="#475569"/>
    <path d="M860 300 C 880 300, 880 220, 910 220 H1100 C 1130 220, 1130 300, 1150 300" stroke="#7dd3fc"/>
    <path d="M960 300 C 975 300, 975 140, 1000 140 H1040 C 1060 140, 1060 300, 1075 300" stroke="#c4b5fd"/>
  </g>
  <g>
    <circle cx="860" cy="300" r="11" fill="#e2e8f0"/>
    <circle cx="950" cy="220" r="10" fill="#7dd3fc"/><circle cx="1010" cy="220" r="10" fill="#7dd3fc"/>
    <circle cx="1060" cy="220" r="12" fill="#fbbf24"/>
    <circle cx="1020" cy="140" r="10" fill="#c4b5fd"/>
    <circle cx="1075" cy="300" r="11" fill="#e2e8f0"/><circle cx="1150" cy="300" r="14" fill="#34d399"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" fill="#94a3b8">
    <text x="842" y="335">C0</text><text x="1140" y="340">M</text>
    <text x="1030" y="200">+budget</text><text x="1000" y="120">req/3</text><text x="905" y="200">req/1</text>
  </g>
</svg>
