name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -q
      - run: python -m goa demo --scenario budget --lang en
      - run: python -m goa demo --mock --scenario budget --lang en
  docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/readme_check.py
      - run: python tests/readme_links_check.py
      - run: python tests/deck_check.py valid
      - run: python tests/deck_check.py count
      - run: python tests/deck_check.py korean
      - run: python tests/deck_check.py story
      - run: python tests/readme_demo_check.py
      - run: python tests/banner_check.py
      - run: python tests/banner_check.py size
      - run: python tests/banner_check.py light
      - run: python tests/polish_skill_check.py frontmatter
      - run: python tests/polish_skill_check.py start
      - run: python tests/polish_skill_check.py list
      - run: python tests/polish_skill_check.py particle
      - run: python tests/polish_skill_check.py meaning
      - run: python tests/polish_skill_check.py middot
      - run: python tests/korean_particle_check.py rules
      - run: python tests/korean_particle_check.py mutations
      - run: python tests/polish_skill_guard.py unpaired
      - run: python tests/polish_skill_guard.py middot
  ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm --prefix ui ci --no-audit --no-fund
      - run: npm --prefix ui test
      - run: node ui/scripts/license-check.mjs
